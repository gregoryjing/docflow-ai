[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docflow-ai"
version = "0.1.0"
description = "企业文档智能处理平台：多格式接入 + 字段映射 + 质量检测 + 人工复核"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-multipart>=0.0.12",
    "rapidfuzz>=3.10",
    "rich>=13.9",
    "sqlalchemy>=2.0.36",
    "typer>=0.14",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# M2 才需要：一级 OCR。M1 不装也能跑通全链路
ocr = [
    "pillow>=10.4",
    "rapidocr-onnxruntime>=1.3",
]
# 高级文档解析后端（可选）：更精准的版面分析与表格结构识别，依赖较重
docling = [
    "docling>=2.0",
]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-python-dateutil>=2.9",
]

[project.scripts]
docflow = "docflow.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/docflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: 需要真实外部服务的集成测试",
]

[tool.ruff]
# 中文按 Unicode 宽度计 2 列，120 覆盖绝大多数中文提示行
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# typer / fastapi 的官方写法就是把这些构造器作为参数默认值
extend-immutable-calls = [
    "typer.Option",
    "typer.Argument",
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["fitz", "PIL", "PIL.*", "rapidocr_onnxruntime", "rapidocr_onnxruntime.*", "docling", "docling.*"]
ignore_missing_imports = true
